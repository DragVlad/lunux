cat > service.yaml << EOF
---
apiVersion: v1
kind: Service
metadata:
  name: my-first-service
  namespace: work
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/version: 1.27.5
spec:
  selector:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/version: 1.27.5
  ports:
   -  protocol: TCP
      port: 80
      targetPort: 80
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-first-deployment
  namespace: work
  labels:
    app.kubernetes.io/name: &app nginx
    app.kubernetes.io/version: &version 1.27.5
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/version: *version
  template:
    metadata:
      name: *app
      namespace: work
      labels:
        app.kubernetes.io/name: *app
        app.kubernetes.io/version: *version
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
EOF